# Beatscript code runner: Piston (sandbox) + a small public gateway.
# Only the gateway gets a public domain (for example run.labupgrade.ai -> port 8080).
# Piston has NO published ports and is reachable only from the gateway.
#
# IMPORTANT: Piston needs "privileged: true". A separate, disposable server is the safest place.
# If you run it next to your other projects, keep the resource limits below (they stop the runner
# from slowing the other projects down) and take a backup first. See README.md.
#
# The limits can be changed from Coolify's environment variables:
#   RUNNER_MEM (default 2g), RUNNER_CPUS (default 2), RUNNER_JOBS_RAM (default 256m)

services:
  piston:
    image: ghcr.io/engineer-man/piston
    privileged: true
    restart: unless-stopped
    # Everything Piston runs (all programs together) lives inside these limits.
    mem_limit: ${RUNNER_MEM:-2g}
    memswap_limit: ${RUNNER_MEM:-2g}      # same as mem_limit: no swap, so it cannot push the host into swapping
    cpus: ${RUNNER_CPUS:-2}
    pids_limit: 1024
    tmpfs:
      - /piston/jobs:size=${RUNNER_JOBS_RAM:-256m}
    volumes:
      - piston_packages:/piston/packages
    environment:
      PISTON_DISABLE_NETWORKING: "true"
      PISTON_RUN_TIMEOUT: "3000"
      PISTON_COMPILE_TIMEOUT: "10000"
      PISTON_OUTPUT_MAX_SIZE: "65536"
      PISTON_MAX_PROCESS_COUNT: "64"
      PISTON_MAX_OPEN_FILES: "256"
      PISTON_MAX_FILE_SIZE: "1000000"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }   # logs can never fill the disk

  gateway:
    build: .
    restart: unless-stopped
    depends_on:
      - piston
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    environment:
      PISTON_URL: "http://piston:2000"
      ALLOWED_ORIGINS: "https://beatscript.labupgrade.ai"
      TRUST_PROXY: "1"
      RATE_PER_MIN: "20"
      MAX_PARALLEL: "2"
    expose:
      - "8080"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  piston_packages:
